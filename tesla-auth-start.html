<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SeanEnergyBot authorize</title>
  <style>
    body { font-family: Georgia, serif; margin: 2rem auto; max-width: 42rem; padding: 0 1rem; color: #1a1a1a; }
    label { display: block; margin-bottom: 0.35rem; }
    input { width: 100%; box-sizing: border-box; font: 1rem/1.4 Consolas, monospace; padding: 0.4rem 0.5rem; }
    button { margin-top: 0.75rem; font: 1rem/1.2 Georgia, serif; padding: 0.35rem 0.8rem; }
    #authorize-url { margin-top: 1.25rem; white-space: pre-wrap; word-break: break-all; font: 0.9rem/1.45 Consolas, monospace; }
  </style>
</head>
<body>
  <h1>SeanEnergyBot authorize</h1>
  <form id="auth-form">
    <label for="client-id">Client ID</label>
    <input id="client-id" name="client_id" type="text" autocomplete="off" required>
    <button type="submit">Authorize</button>
  </form>
  <p id="authorize-url"></p>
  <script>
    document.getElementById("auth-form").addEventListener("submit", function (event) {
      event.preventDefault();
      var clientId = document.getElementById("client-id").value.trim();
      var params = new URLSearchParams();
      params.set("response_type", "code");
      params.set("client_id", clientId);
      params.set("redirect_uri", "https://seanaguinaga.com/auth/callback");
      params.set("scope", "openid offline_access energy_device_data energy_cmds");
      params.set("state", "sean-energy-bot-1");
      params.set("prompt", "login");
      params.set("prompt_missing_scopes", "true");
      params.set("locale", "en-US");
      var url = "https://auth.tesla.com/oauth2/v3/authorize?" + params.toString();
      document.getElementById("authorize-url").textContent = url;
      window.location.assign(url);
    });
  </script>
</body>
</html>

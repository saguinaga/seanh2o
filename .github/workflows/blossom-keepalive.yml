name: Blossom keepalive

# Pages only. NPC AI is off (config.js: aiChatEnabled = false).
# The old worker host no longer resolves; pinging it emailed on every cron.
on:
  schedule:
    - cron: '20 16 * * *'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check Blossom pages
        run: |
          curl -sf "https://seanaguinaga.com/blossom/play.html" | grep -q 'blossom-build'
          curl -sf "https://seanaguinaga.com/blossom/js/config.js" | grep -q 'BLOSSOM_CONFIG'
          echo "Blossom prod OK"

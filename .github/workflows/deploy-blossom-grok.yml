name: Deploy Blossom Grok 4.5 API

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/blossom-ai/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-blossom-grok.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set XAI_API_KEY secret on Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$XAI_API_KEY" ]; then
            echo "::warning::Skip deploy — add SUPABASE_ACCESS_TOKEN + XAI_API_KEY to GitHub repo secrets"
            exit 0
          fi
          supabase secrets set XAI_API_KEY="$XAI_API_KEY" --project-ref mtqezgchhggmlrfzfyjb

      - name: Deploy blossom-ai edge function (grok-4.5-latest)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$XAI_API_KEY" ]; then
            exit 0
          fi
          supabase functions deploy blossom-ai --no-verify-jwt --project-ref mtqezgchhggmlrfzfyjb

      - name: Health check
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then exit 0; fi
          sleep 3
          curl -sf "https://mtqezgchhggmlrfzfyjb.supabase.co/functions/v1/blossom-ai/health" | grep -q grok-4.5